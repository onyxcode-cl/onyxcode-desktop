[package]
name = "cu-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Helper nativo de Control del PC para Lazunox en Windows (UI Automation, SendInput, capturas). Sin red ni telemetría."
publish = false
build = "build.rs"
license = "UNLICENSED"

[lib]
name = "cu_helper"
path = "src/lib.rs"

[[bin]]
name = "cu-helper"
path = "src/main.rs"

# Sin dependencias fuera de Windows: lo PURO se prueba con `cargo test` nativo.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
