server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  location = /lazunox { return 301 /lazunox/; }
  location /lazunox/ {
    index index.html;
    try_files $uri $uri/ =404;
  }
  # Instaladores: se descargan, no se muestran; sin compresión y con reanudación (Range) para archivos grandes.
  location ^~ /lazunox/descargas/ {
    types {
      application/x-apple-diskimage dmg;
      application/vnd.microsoft.portable-executable exe;
      application/json json;
    }
    default_type text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=300" always;
    if ($request_uri ~* "\.(dmg|exe)(\?.*)?$") { add_header Content-Disposition "attachment" always; add_header Cache-Control "public, max-age=300" always; add_header X-Content-Type-Options "nosniff" always; }
    try_files $uri =404;
  }
  location / { return 404; }
}
