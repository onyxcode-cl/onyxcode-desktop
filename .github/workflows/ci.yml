# Integración continua: comprobaciones SIN secretos y SIN abrir Electron (nada de E2E ni de empaquetado).
# El E2E con Electron real se corre en local antes de etiquetar (`npm run verify`, docs/RELEASE.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permisos mínimos: solo lectura. Este flujo no necesita escribir nada.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, lint, formato y pruebas
    # macOS: varias pruebas usan codesign/ditto/sandbox-exec de verdad y el producto solo existe para macOS arm64.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # Acciones fijadas por SHA de commit (no por etiqueta movible). Para actualizarlas: gh api repos/<accion>/git/ref/tags/<etiqueta>.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Pruebas de los scripts de publicación (con dobles, sin firmar ni notarizar nada)
        run: npm run test:release-scripts
