<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icono de app "Faceta" (fuente de build/icon.png e icon.icns). Regenerar: node build/render-icon.mjs -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f75f7"/>
      <stop offset="0.48" stop-color="#2c4fd8"/>
      <stop offset="1" stop-color="#141f66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd772" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd772" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0a1033" flood-opacity="0.35"/>
    </filter>
    <filter id="gemShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.6" flood-color="#0a1440" flood-opacity="0.35"/>
    </filter>
    <clipPath id="gem">
      <rect x="7.5" y="7.5" width="17" height="17" rx="3.6" transform="rotate(45 16 16)"/>
    </clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <!-- Gema: sistema de 32 unidades escalado a ~20x -->
  <g transform="translate(508 540) scale(21) translate(-16 -16)">
    <g filter="url(#gemShadow)">
      <g clip-path="url(#gem)">
        <polygon points="16,-2 16,14.6 -2,16" fill="#ffffff"/>
        <polygon points="16,-2 34,16 16,14.6" fill="#dfe6ff"/>
        <polygon points="-2,16 16,14.6 16,34" fill="#b4c3ff"/>
        <polygon points="16,14.6 34,16 16,34" fill="#8a9ff4"/>
      </g>
    </g>
    <circle cx="26" cy="6" r="6" fill="url(#sparkGlow)"/>
    <path d="M26 1.2 Q26.85 5.15 30.8 6 Q26.85 6.85 26 10.8 Q25.15 6.85 21.2 6 Q25.15 5.15 26 1.2Z" fill="#f4c65a"/>
  </g>
</svg>
