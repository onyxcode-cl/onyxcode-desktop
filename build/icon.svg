<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icono de app "Aro" (anillo abierto y punto dorado) (fuente de build/icon.png e icon.icns). Regenerar: node build/render-icon.mjs -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f75f7"/>
      <stop offset="0.48" stop-color="#2c4fd8"/>
      <stop offset="1" stop-color="#141f66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0a1033" flood-opacity="0.35"/>
    </filter>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.7" flood-color="#0a1440" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <!-- Marca «Aro»: sistema de 32 unidades escalado a ~21x, centrado en el azulejo -->
  <g transform="translate(512 520) scale(21.4) translate(-16 -16)">
    <g filter="url(#markShadow)">
      <path d="M16 5.6A10.4 10.4 0 1 0 26.4 16" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
    </g>
    <circle cx="22.6" cy="7.6" r="2.3" fill="#f4c65a"/>
  </g>
</svg>
